# Unit tests + coverage on every PR and on main.
#
# Two gates:
#   1. `go vet` + the unit suite (with -race).
#   2. New-code coverage: every line a PR adds must be executed by some test
#      (scripts/new_code_coverage.py — the repo-wide total is history, the
#      bar applies to the change). Runs only on pull requests, where there
#      is a base to diff against.
#
# The full profile is uploaded as an artifact so reviewers can open the
# annotated HTML (`go tool cover -html=coverage.out`) locally.
name: test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: test-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The new-code check diffs against the PR base, which needs history.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: vet
        run: go vet ./...

      - name: unit tests with coverage
        run: go test ./nullplatform/ -count=1 -race -coverprofile=coverage.out -timeout=300s

      - name: coverage summary
        run: go tool cover -func=coverage.out | tail -5

      - name: new-code coverage gate (PRs)
        if: github.event_name == 'pull_request'
        env:
          # Through an env var, never interpolated into the command line.
          BASE_REF: ${{ github.base_ref }}
        run: python3 scripts/new_code_coverage.py "origin/${BASE_REF}"

      - name: upload profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: ignore
